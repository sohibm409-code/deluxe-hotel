{% load i18n %}
<!-- ========================================================
     DELUXE HOTEL - FLOATING QUICK WIDGETS
     ======================================================== -->

<!-- 1. FLOATING SPEED DIAL (QUICK CONTACT) -->
<div class="floating-speed-dial" id="floatingSpeedDial">
  <button type="button" class="speed-dial-trigger" onclick="toggleSpeedDial()" aria-label="{% trans "Quick Contact" %}" title="{% trans "Quick Contact" %}">
    <i class="fa-solid fa-headset icon-open"></i>
    <i class="fa-solid fa-xmark icon-close"></i>
  </button>

  <div class="speed-dial-menu">
    <!-- Instagram Profile -->
    <a href="https://www.instagram.com/jovliyev1626/" target="_blank" class="speed-dial-item" title="Instagram: @jovliyev1626">
      <span class="speed-dial-tooltip">Instagram: @jovliyev1626</span>
      <span class="speed-dial-btn btn-instagram" style="background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: #fff;">
        <i class="fa-brands fa-instagram"></i>
      </span>
    </a>

    <!-- Telegram Chat -->
    <a href="https://t.me/deluxe_hotel_resort" target="_blank" class="speed-dial-item" title="{% trans "Telegram Chat" %}">
      <span class="speed-dial-tooltip">{% trans "Telegram Chat" %}</span>
      <span class="speed-dial-btn btn-telegram">
        <i class="fa-brands fa-telegram"></i>
      </span>
    </a>

    <!-- Direct Phone Call -->
    <a href="tel:+998940550855" class="speed-dial-item" title="{% trans "Call" %}">
      <span class="speed-dial-tooltip">{% trans "Phone" %}: +998 (94) 055-08-55</span>
      <span class="speed-dial-btn btn-phone">
        <i class="fa-solid fa-phone"></i>
      </span>
    </a>

    <!-- VIP Transfer Modal -->
    <button type="button" class="speed-dial-item" onclick="openServiceModal('modal-transfer'); toggleSpeedDial();" title="{% trans "Order VIP Transfer" %}">
      <span class="speed-dial-tooltip">{% trans "Order VIP Transfer" %}</span>
      <span class="speed-dial-btn btn-transfer">
        <i class="fa-solid fa-car-side"></i>
      </span>
    </button>

    <!-- 24/7 Reception Modal -->
    <button type="button" class="speed-dial-item" onclick="openServiceModal('modal-reception'); toggleSpeedDial();" title="{% trans "24/7 Reception & Concierge" %}">
      <span class="speed-dial-tooltip">{% trans "24/7 Reception & Concierge" %}</span>
      <span class="speed-dial-btn btn-reception">
        <i class="fa-solid fa-bell-concierge"></i>
      </span>
    </button>
  </div>
</div>

<!-- 2. BACK TO TOP BUTTON -->
<button type="button" class="back-to-top-btn" id="backToTopBtn" onclick="scrollToTop()" aria-label="{% trans "Back to top" %}" title="{% trans "Back to top" %}">
  <i class="fa-solid fa-arrow-up"></i>
</button>

<script>
  function toggleSpeedDial() {
    var dial = document.getElementById('floatingSpeedDial');
    if (dial) {
      dial.classList.toggle('open');
    }
  }

  function scrollToTop() {
    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  }

  // Scroll listener for Back to Top button
  window.addEventListener('scroll', function() {
    var btn = document.getElementById('backToTopBtn');
    if (!btn) return;
    if (window.scrollY > 350) {
      btn.classList.add('visible');
    } else {
      btn.classList.remove('visible');
    }
  });

  // Close speed dial when clicking outside
  document.addEventListener('click', function(e) {
    var dial = document.getElementById('floatingSpeedDial');
    if (dial && dial.classList.contains('open')) {
      if (!dial.contains(e.target)) {
        dial.classList.remove('open');
      }
    }
  });
</script>
